<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم المشرف - منصة العبور</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginPage" class="login-box">
  <div style="font-size:48px">🔐</div>
  <h2>لوحة تحكم المشرف</h2>
  <p>منصة العبور - أ. أحمد رزق</p>
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور" onkeyup="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">دخول</button>
  <div id="loginError" class="msg error hidden"></div>
</div>

<div id="adminPanel" class="container hidden">
  <header class="top-bar">
    <div><h1>📚 منصة العبور</h1><small>أ. أحمد رزق - لوحة التحكم</small></div>
    <div class="row">
      <button class="ghost" onclick="toggleDark()" title="الوضع الليلي"><i class="fas fa-moon"></i></button>
      <button class="ghost" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </header>
  <nav id="nav" class="nav-tabs"></nav>
  <main id="pages"></main>
</div>
<div id="toasts"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/home.js"></script>
<script src="js/lessons.js"></script>
<script src="js/units.js"></script>
<script src="js/questions.js"></script>
<script src="js/students.js"></script>
<script src="js/results.js"></script>
<script src="js/complaints.js"></script>
<script src="js/reports.js"></script>
<script src="js/announcements.js"></script>
<script src="js/grading.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
